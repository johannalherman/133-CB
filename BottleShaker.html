<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEM 133 CB - Salt Solution Density Simulation</title>
    <style>
      body {
  margin: 0;
  padding: 0;
  background-color: #1e1e1e;
  color: #fff;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
}

#container {
  position: relative;
  width: 450px;
  height: 600px;
}

/* Layer 2: Your Image */
#myImage {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 0;
  width: 100%;
  z-index: 2;
  pointer-events: none; /* Allows mouse clicks to pass through to the bottle canvas */
  object-fit: contain;
}
/* Layer 1 & Layer 3: Positioned over a specific area of the image */
#saltCanvas {
  position: absolute;
  /* Change these to match where on your image you want the salt animation to occur */
  top: 60px;   /* Y-offset from the top of the container */
  left: 50%;  /* X-offset from the left of the container */
  transform: translateX(-50%);
  width: 160px; /* Custom canvas width */
  height: 400px;/* Custom canvas height */
  z-index: 1; /* Behind image */
}

#bottleCanvas {
  position: absolute;
  /* Change these to match where on your image you want the salt animation to occur */
  top: 60px;   /* Y-offset from the top of the container */
  left: 50%;  /* X-offset from the left of the container */
  transform: translateX(-50%);
  width: 360px; /* Custom canvas width */
  height: 400px;/* Custom canvas height */
  z-index: 3; /* In front of image */
}

#bottleCanvas:active {
  cursor: grabbing;
}

.ui-overlay {
  position: absolute;
  top: 15px;
  right: 15px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

button {
  background-color: #444;
  color: #fff;
  border: 1px solid #666;
  padding: 6px 12px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

button:hover {
  background-color: #555;
}

.counter {
  font-size: 13px;
  color: #aaa;
}

.instructions {
  margin-top: 15px;
  color: #aaa;
  font-size: 14px;
  text-align: center;
}

      
    </style>
  </head>
  <body>
    <div id="container">
  <canvas id="saltCanvas" width="160" height="400"></canvas>
  <img
    id="myImage"
    src="https://github.com/johannalherman/133-CB/blob/main/Beaker%20on%20Balnce%20with%20tare%20+%20reset.png?raw=true"
    alt="Overlay Image"
    alt="Overlay Image"
  />
  <canvas id="bottleCanvas" width="360" height="400"></canvas>
</div>
<div class="ui-overlay">
  <button id="resetBtn">Reset Pile</button>
  <div class="counter" id="particleCount">Salt Grains: 0</div>
</div>


    
    
  <script>
    // Canvas setup
const saltCanvas = document.getElementById('saltCanvas');
const saltCtx = saltCanvas.getContext('2d');

const bottleCanvas = document.getElementById('bottleCanvas');
const bottleCtx = bottleCanvas.getContext('2d');

const countDisplay = document.getElementById('particleCount');
const resetBtn = document.getElementById('resetBtn');

const width = 360;
const height = 400;

// Heightmap setup for pile accumulation
const floorY = height - 0;
const gridScale = 2;
const gridCols = Math.ceil(width / gridScale);
const heightMap = new Float32Array(gridCols).fill(floorY);

// Opaque Inverted Bottle state object (20-degree tilt)
const bottleAngle = 20 * (Math.PI / 180);
const bottle = {
  x: width / 2,
  y: 180,
  width: 80,
  height: 100,
  neckWidth: 60,
  neckHeight: 10,
  angle: bottleAngle,
  vx: 0,
  vy: 0,
  isDragging: false,
  dragOffsetX: 0,
  dragOffsetY: 0,
  lastX: width / 2,
  lastY: 180,
};

const gravity = 0.4;
let particles = [];

// Salt Particle Class
class SaltGrain {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.size = 1.5 + Math.random() * 1.5;
    this.vx = vx;
    this.vy = vy;
    this.settled = false;
    const brightness = 220 + Math.floor(Math.random() * 35);
    this.color = `rgba(${brightness}, ${brightness}, ${brightness}, 0.9)`;
  }

  update() {
    if (this.settled) return;

    this.vy += gravity;
    this.vx *= 0.98;

    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 2) {
      this.x = 2;
      this.vx *= -0.5;
    }
    if (this.x > width - 2) {
      this.x = width - 2;
      this.vx *= -0.5;
    }

    // Heightmap Pile Collision Detection
    const col = Math.floor(this.x / gridScale);
    if (col >= 0 && col < gridCols) {
      const targetY = heightMap[col];

      if (this.y >= targetY) {
        this.y = targetY;
        this.settle(col);
      }
    }
  }

  settle(col) {
    this.settled = true;
    let currentCol = col;
    let slide = true;
    const maxAngleDelta = 3;

    while (slide) {
      let leftCol = Math.max(0, currentCol - 1);
      let rightCol = Math.min(gridCols - 1, currentCol + 1);

      let leftDiff = heightMap[leftCol] - heightMap[currentCol];
      let rightDiff = heightMap[rightCol] - heightMap[currentCol];

      if (leftDiff > maxAngleDelta && leftDiff >= rightDiff) {
        currentCol = leftCol;
      } else if (rightDiff > maxAngleDelta) {
        currentCol = rightCol;
      } else {
        slide = false;
      }
    }

    heightMap[currentCol] -= this.size * 0.8;
    this.x = currentCol * gridScale + gridScale / 2;
    this.y = heightMap[currentCol];
  }

  draw() {
    saltCtx.fillStyle = this.color;
    saltCtx.fillRect(
      this.x - this.size / 2,
      this.y - this.size / 2,
      this.size,
      this.size,
    );
  }
}

// Render Bottle on Front Canvas
function drawBottle() {
  bottleCtx.save();
  bottleCtx.translate(bottle.x, bottle.y);
  bottleCtx.rotate(bottle.angle);

  bottleCtx.fillStyle = '#eed7fe';
  bottleCtx.strokeStyle = '#b0b0b0';
  bottleCtx.lineWidth = 3;

  const w = bottle.width;
  const h = bottle.height;
  const nw = bottle.neckWidth;
  const nh = bottle.neckHeight;

  const bLeft = -w / 2;
  const bRight = w / 2;
  const bTop = -h / 2;
  const bBottom = h / 2;
  const nLeft = -nw / 2;
  const nRight = nw / 2;
  const nBottom = bBottom + nh;

  // Inverted bottle body path
  bottleCtx.beginPath();
  bottleCtx.moveTo(bLeft + 10, bTop);
  bottleCtx.lineTo(bRight - 10, bTop);
  bottleCtx.quadraticCurveTo(bRight, bTop, bRight, bTop + 10);
  bottleCtx.lineTo(bRight, bBottom - 10);
  bottleCtx.quadraticCurveTo(bRight, bBottom, bRight - 10, bBottom);
  bottleCtx.lineTo(nRight, bBottom);
  bottleCtx.lineTo(nRight, nBottom);
  bottleCtx.lineTo(nLeft, nBottom);
  bottleCtx.lineTo(nLeft, bBottom);
  bottleCtx.lineTo(bLeft + 10, bBottom);
  bottleCtx.quadraticCurveTo(bLeft, bBottom, bLeft, bBottom - 10);
  bottleCtx.lineTo(bLeft, bTop + 10);
  bottleCtx.quadraticCurveTo(bLeft, bTop, bLeft + 10, bTop);
  bottleCtx.closePath();

  bottleCtx.fill();
  bottleCtx.stroke();

  // Label Badge
  const labelWidth = w - 16;
  const labelHeight = 44;
  const labelY = 0;

  bottleCtx.beginPath();
  bottleCtx.roundRect(
    -labelWidth / 2,
    labelY - labelHeight / 2,
    labelWidth,
    labelHeight,
    4,
  );
  bottleCtx.fill();

  // Label Text
  bottleCtx.fillStyle = '#8000CF';
  bottleCtx.font = 'bold 10px system-ui, sans-serif';
  bottleCtx.textAlign = 'center';
  bottleCtx.textBaseline = 'middle';
  bottleCtx.fillText('SHAKE TO', 0, labelY - 7);
  bottleCtx.fillText('ADD SALT', 0, labelY + 7);

  // Dispenser cap rim
  bottleCtx.fillStyle = '#8000CF';
  bottleCtx.fillRect(nLeft - 2, nBottom - 9, nw + 4, 11);

  bottleCtx.restore();
}

// Example: If bottleCanvas is at left: 0px and saltCanvas is at left: 200px
const saltCanvasOffsetX = 100; 

function spawnSalt(intensity) {
  const count = Math.min(Math.floor(intensity * 1.5), 12);
  const localNeckBottom = bottle.height / 2 + bottle.neckHeight;

  for (let i = 0; i < count; i++) {
    const localX = (Math.random() - 0.5) * (bottle.neckWidth - 6);
    const localY = localNeckBottom + Math.random() * 4;

    // Calculate world position on the bottle canvas
    const worldX = bottle.x + (localX * Math.cos(bottle.angle) - localY * Math.sin(bottle.angle));
    const worldY = bottle.y + (localX * Math.sin(bottle.angle) + localY * Math.cos(bottle.angle));

    // Convert worldX to salt canvas space by subtracting the offset
    const saltX = worldX - saltCanvasOffsetX; 
    const saltY = worldY;

    const ejectionSpeed = 1 + Math.random() * 3;
    const dirX = -Math.sin(bottle.angle);
    const dirY = Math.cos(bottle.angle);

    const vx = bottle.vx * 0.3 + dirX * ejectionSpeed + (Math.random() - 0.5) * 1.5;
    const vy = Math.max(0.5, bottle.vy * 0.2) + dirY * ejectionSpeed;

    // Only add particles if they fall within the salt canvas boundaries
    if (saltX >= 0 && saltX <= saltCanvas.width) {
      particles.push(new SaltGrain(saltX, saltY, vx, vy));
    }
  }
}

// Mouse Interaction Handlers targeting bottleCanvas
bottleCanvas.addEventListener('mousedown', (e) => {
  const rect = bottleCanvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const dist = Math.hypot(mouseX - bottle.x, mouseY - bottle.y);

  if (dist < 110) {
    bottle.isDragging = true;
    bottle.dragOffsetX = mouseX - bottle.x;
    bottle.dragOffsetY = mouseY - bottle.y;
    bottle.lastX = bottle.x;
    bottle.lastY = bottle.y;
  }
});

window.addEventListener('mousemove', (e) => {
  if (!bottle.isDragging) return;

  const rect = bottleCanvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  bottle.x = mouseX - bottle.dragOffsetX;
  bottle.y = mouseY - bottle.dragOffsetY;

  bottle.vx = bottle.x - bottle.lastX;
  bottle.vy = bottle.y - bottle.lastY;

  const speed = Math.sqrt(bottle.vx * bottle.vx + bottle.vy * bottle.vy);

  if (speed > 4) {
    spawnSalt(speed);
  }

  bottle.lastX = bottle.x;
  bottle.lastY = bottle.y;
});

window.addEventListener('mouseup', () => {
  bottle.isDragging = false;
});

resetBtn.addEventListener('click', () => {
  particles = [];
  heightMap.fill(floorY);
});

// Render Loop
function animate() {
  // Clear both contexts cleanly
  saltCtx.clearRect(0, 0, width, height);
  bottleCtx.clearRect(0, 0, width, height);

  // Render Floor line on back canvas
  saltCtx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
  saltCtx.lineWidth = 2;
  saltCtx.beginPath();
  saltCtx.moveTo(0, floorY);
  saltCtx.lineTo(width, floorY);
  saltCtx.stroke();

  // Render Salt Particles on back canvas (behind image)
  for (let i = 0; i < particles.length; i++) {
    particles[i].update();
    particles[i].draw();
  }

  // Render Bottle on front canvas (in front of image)
  drawBottle();

  countDisplay.innerText = `Salt Grains: ${particles.length}`;

  requestAnimationFrame(animate);
}

animate();


    
  </script>
  </body>
</html>
