  <script>
function getRandomAmount(min, max) {
  return Math.random() * (max - min) + min;
}
let massHold1 = getRandomAmount(35, 40);
let massHold2 = getRandomAmount(25, 30);

// Balance 1 setup
let saltMass = 0;
let beakerMass = massHold1;
let totalMass_1 = beakerMass;
let tareOffset_1 = 0;

// Balance 2 setup
let waterMass = 0;
let targetWaterMass = 0; // Tracks incoming target water mass
let solVolume_1 = 0;
let targetSolVolume_1 = 0; // Tracks incoming target liquid level
let px_scalor_1 = 5; // number of px in mL in beaker image

// Balance 3 setup
let cylinderMass = massHold2;
let totalMass_2 = cylinderMass;
let massSolution_2 = 0;
let tareOffset_2 = 0;
let solVolume_2 = 0;
let cylinderVolume = 380; // Total px height volume of the cylinder
let px_scalor_2 = 36.14543470311407; // number of px in mL in cylinder image

// Canvas setup
const saltCanvas = document.getElementById('saltCanvas');
const saltCtx = saltCanvas.getContext('2d');

const bottleCanvas = document.getElementById('bottleCanvas');
const bottleCtx = bottleCanvas.getContext('2d');

const resetBtn_1 = document.getElementById('resetBtn-1');
const tareBtn_1 = document.getElementById('tareBtn-1');
const resetBtn_3 = document.getElementById('resetBtn-3');
const tareBtn_3 = document.getElementById('tareBtn-3');

const tab2button = document.getElementById("tab2button");
const tab3button = document.getElementById("tab3button");

const width = bottleCanvas.width;
const height = bottleCanvas.height;

// Heightmap setup for pile accumulation
const floorY = height - 0;
const gridScale = 2;
const gridCols = Math.ceil(width / gridScale);
const heightMap = new Float32Array(gridCols).fill(floorY);

// Opaque Inverted Bottle state object (20-degree tilt)
const bottleAngle = 20 * (Math.PI / 180);
const bottle = {
  x: width / 1.8,
  y: 100,
  width: 80,
  height: 100,
  neckWidth: 60,
  neckHeight: 10,
  angle: bottleAngle,
  vx: 0,
  vy: 0,
  isDragging: false,
  dragOffsetX: 0,
  dragOffsetY: 0,
  lastX: width / 2,
  lastY: 180,
};

const gravity = 0.4;
let particles = [];

// Salt Particle Class
class SaltGrain {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.size = 1.0 + Math.random();
    this.vx = vx;
    this.vy = vy;
    this.settled = false;

    const shade = 190 + Math.floor(Math.random() * 40);
    this.color = `rgba(${shade}, ${shade + 5}, ${shade + 10}, 0.85)`;
    this.shadowColor = `rgba(${shade - 30}, ${shade - 30}, ${shade - 30}, 0.4)`;
  }

  update() {
    if (this.settled) return;

    this.vy += gravity;
    this.vx *= 0.98;

    this.x += this.vx;
    this.y += this.vy;

    if (this.x < 2) {
      this.x = 2;
      this.vx *= -0.5;
    }
    if (this.x > width - 2) {
      this.x = width - 2;
      this.vx *= -0.5;
    }

    const col = Math.floor(this.x / gridScale);
    if (col >= 0 && col < gridCols) {
      const targetY = heightMap[col];

      if (this.y >= targetY) {
        this.y = targetY;
        this.settle(col);
      }
    }
  }

  settle(col) {
    this.settled = true;
    let currentCol = col;
    let slide = true;
    const maxAngleDelta = 3;

    while (slide) {
      let leftCol = Math.max(0, currentCol - 1);
      let rightCol = Math.min(gridCols - 1, currentCol + 1);

      let leftDiff = heightMap[leftCol] - heightMap[currentCol];
      let rightDiff = heightMap[rightCol] - heightMap[currentCol];

      if (leftDiff > maxAngleDelta && leftDiff >= rightDiff) {
        currentCol = leftCol;
      } else if (rightDiff > maxAngleDelta) {
        currentCol = rightCol;
      } else {
        slide = false;
      }
    }

    heightMap[currentCol] -= this.size * 0.8;
    this.x = currentCol * gridScale + gridScale / 2;
    this.y = heightMap[currentCol];
  }

  draw() {
    saltCtx.fillStyle = this.color;
    saltCtx.fillRect(
      this.x - this.size / 2,
      this.y - this.size / 2,
      this.size,
      this.size,
    );

    saltCtx.fillStyle = this.shadowColor;
    saltCtx.fillRect(
      this.x - this.size / 2,
      this.y + this.size / 2 - 0.5,
      this.size,
      0.5,
    );
  }
}

function drawBottle() {
  bottleCtx.save();
  bottleCtx.translate(bottle.x, bottle.y);
  bottleCtx.rotate(bottle.angle);

  bottleCtx.fillStyle = '#eed7fe';
  bottleCtx.strokeStyle = '#b0b0b0';
  bottleCtx.lineWidth = 3;

  const w = bottle.width;
  const h = bottle.height;
  const nw = bottle.neckWidth;
  const nh = bottle.neckHeight;

  const bLeft = -w / 2;
  const bRight = w / 2;
  const bTop = -h / 2;
  const bBottom = h / 2;
  const nLeft = -nw / 2;
  const nRight = nw / 2;
  const nBottom = bBottom + nh;

  bottleCtx.beginPath();
  bottleCtx.moveTo(bLeft + 10, bTop);
  bottleCtx.lineTo(bRight - 10, bTop);
  bottleCtx.quadraticCurveTo(bRight, bTop, bRight, bTop + 10);
  bottleCtx.lineTo(bRight, bBottom - 10);
  bottleCtx.quadraticCurveTo(bRight, bBottom, bRight - 10, bBottom);
  bottleCtx.lineTo(nRight, bBottom);
  bottleCtx.lineTo(nRight, nBottom);
  bottleCtx.lineTo(nLeft, nBottom);
  bottleCtx.lineTo(nLeft, bBottom);
  bottleCtx.lineTo(bLeft + 10, bBottom);
  bottleCtx.quadraticCurveTo(bLeft, bBottom, bLeft, bBottom - 10);
  bottleCtx.lineTo(bLeft, bTop + 10);
  bottleCtx.quadraticCurveTo(bLeft, bTop, bLeft + 10, bTop);
  bottleCtx.closePath();

  bottleCtx.fill();
  bottleCtx.stroke();

  const labelWidth = w - 16;
  const labelHeight = 44;
  const labelY = 0;

  bottleCtx.beginPath();
  bottleCtx.roundRect(
    -labelWidth / 2,
    labelY - labelHeight / 2,
    labelWidth,
    labelHeight,
    4,
  );
  bottleCtx.fill();

  bottleCtx.fillStyle = '#8000CF';
  bottleCtx.font = 'bold 10px system-ui, sans-serif';
  bottleCtx.textAlign = 'center';
  bottleCtx.textBaseline = 'middle';
  bottleCtx.fillText('SHAKE TO', 0, labelY - 7);
  bottleCtx.fillText('ADD SALT', 0, labelY + 7);

  bottleCtx.fillStyle = '#8000CF';
  bottleCtx.fillRect(nLeft - 2, nBottom - 9, nw + 4, 11);

  bottleCtx.restore();
}

const saltCanvasOffsetX = 120;

function spawnSalt(intensity) {
  const count = Math.min(Math.floor(intensity * 0.5), 8);
  const localNeckBottom = bottle.height / 2 + bottle.neckHeight;

  for (let i = 0; i < count; i++) {
    const localX = (Math.random() - 0.5) * (bottle.neckWidth - 6);
    const localY = localNeckBottom + Math.random() * 4;

    const worldX =
      bottle.x +
      (localX * Math.cos(bottle.angle) - localY * Math.sin(bottle.angle));
    const worldY =
      bottle.y +
      (localX * Math.sin(bottle.angle) + localY * Math.cos(bottle.angle));

    const saltX = worldX - saltCanvasOffsetX;
    const saltY = worldY;

    const ejectionSpeed = 1 + Math.random() * 3;
    const dirX = -Math.sin(bottle.angle);
    const dirY = Math.cos(bottle.angle);

    const vx =
      bottle.vx * 0.3 + dirX * ejectionSpeed + (Math.random() - 0.5) * 1.5;
    const vy = Math.max(0.5, bottle.vy * 0.2) + dirY * ejectionSpeed;

    if (saltX >= 0 && saltX <= saltCanvas.width) {
      particles.push(new SaltGrain(saltX, saltY, vx, vy));
    }
  }
}

bottleCanvas.addEventListener('mousedown', (e) => {
  const rect = bottleCanvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const dist = Math.hypot(mouseX - bottle.x, mouseY - bottle.y);

  if (dist < 110) {
    bottle.isDragging = true;
    bottle.dragOffsetX = mouseX - bottle.x;
    bottle.dragOffsetY = mouseY - bottle.y;
    bottle.lastX = bottle.x;
    bottle.lastY = bottle.y;
  }
});

window.addEventListener('mousemove', (e) => {
  if (!bottle.isDragging) return;

  const rect = bottleCanvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  bottle.x = mouseX - bottle.dragOffsetX;
  bottle.y = mouseY - bottle.dragOffsetY;

  bottle.vx = bottle.x - bottle.lastX;
  bottle.vy = bottle.y - bottle.lastY;

  const speed = Math.sqrt(bottle.vx * bottle.vx + bottle.vy * bottle.vy);

  if (speed > 15) {
    spawnSalt(speed);
  }

  bottle.lastX = bottle.x;
  bottle.lastY = bottle.y;
});

window.addEventListener('mouseup', () => {
  bottle.isDragging = false;
});

function updateMassDisplay_1() {
  document.querySelector('#total-mass-1 span').textContent =

const tab2WaterCanvas = document.getElementById('tab2WaterCanvas');
const tab2WaterCtx = tab2WaterCanvas.getContext('2d');

const t2Width = tab2WaterCanvas.width;
const t2Height = tab2WaterCanvas.height;

let waterDroplets = [];
let totalDropletsReleased = 0;
let isSqueezing = false;

let isDissolving = false;
let saltOpacity = 1.0;
const dissolveSpeed = 0.001;

const washBottle = {
  x: 90,
  y: 120,
  width: 105,
  height: 150,
  nozzleCurveX: 40,
  isSqueezed: false,
  angle: 20 * (Math.PI / 180),
};

class WaterDrop {
  constructor(x, y, vx, vy) {
    this.x = x;
    this.y = y;
    this.vx = vx;
    this.vy = vy;
    this.radius = 2 + Math.random() * 1.5;
    this.life = 1.0;
  }

  update() {
    this.vy += 0.3;
    this.x += this.vx;
    this.y += this.vy;
  }

  draw() {
    tab2WaterCtx.fillStyle = '#abdcf2';
    tab2WaterCtx.beginPath();
    tab2WaterCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    tab2WaterCtx.fill();
  }
}

function drawWashBottle() {
  tab2WaterCtx.save();

  const centerX = washBottle.x;
  const centerY = washBottle.y + washBottle.height / 2;
  tab2WaterCtx.translate(centerX, centerY);

  tab2WaterCtx.rotate(washBottle.angle);

  const squeezeFactor = washBottle.isSqueezed ? 0.90 : 1.0;
  const w = washBottle.width * squeezeFactor;
  const h = washBottle.height;

  tab2WaterCtx.fillStyle = 'rgba(230, 240, 245, 0.85)';
  tab2WaterCtx.strokeStyle = '#a0b0b8';
  tab2WaterCtx.lineWidth = 2;

  tab2WaterCtx.beginPath();
  tab2WaterCtx.roundRect(-w / 2, -h / 2, w, h, 8);
  tab2WaterCtx.fill();
  tab2WaterCtx.stroke();

  tab2WaterCtx.fillStyle = 'rgba(160, 220, 255, 0.4)';
  tab2WaterCtx.fillRect(-w / 2 + 3, -h / 2 + h * 0.35, w - 6, h * 0.6);

  tab2WaterCtx.fillStyle = '#8000CF';
  tab2WaterCtx.fillRect(-24, -h / 2 - 18, 48, 18);

  tab2WaterCtx.strokeStyle = '#8000CF';
  tab2WaterCtx.lineWidth = 8;
  tab2WaterCtx.beginPath();
  tab2WaterCtx.moveTo(0, -h / 2 - 12);
  tab2WaterCtx.lineTo(0, -h / 2 - 30);
  tab2WaterCtx.quadraticCurveTo(
    0,
    -h / 2 - 50,
    washBottle.nozzleCurveX,
    -h / 2 - 45,
  );
  tab2WaterCtx.stroke();

  tab2WaterCtx.fillStyle = '#8000CF';
  tab2WaterCtx.font = 'bold 14px system-ui, sans-serif';
  tab2WaterCtx.textAlign = 'center';
  tab2WaterCtx.fillText('D.I.', 0, -h / 7 - 7);
  tab2WaterCtx.fillText('WATER', 0, -h / 7 + 7);
  tab2WaterCtx.fillText('CLICK', 0, h / 5 - 7);
  tab2WaterCtx.fillText('TO ADD', 0, h / 5 + 7);

  tab2WaterCtx.restore();
}

function increaseLiquidLevel_1() {
  if (solVolume_1 > 0) {
    document.getElementById('solution-1').style.height =
      solVolume_1 * px_scalor_1 + 4 + 'px';
  } else {
    document.getElementById('solution-1').style.height =
      solVolume_1 * px_scalor_1 + 'px';
  }
}

function sprayWater() {
  const h = washBottle.height;
  const angle = washBottle.angle;

  const localTipX = washBottle.nozzleCurveX;
  const localTipY = -h / 2 - 45;

  const worldTipX =
    washBottle.x + (localTipX * Math.cos(angle) - localTipY * Math.sin(angle));
  const worldTipY =
    washBottle.y +
    h / 2 +
    (localTipX * Math.sin(angle) + localTipY * Math.cos(angle));

  for (let i = 0; i < 3; i++) {
    const baseSpeed = 2 + Math.random() * 1.5;
    const vx = Math.cos(angle) * baseSpeed + Math.sin(angle) * -2;
    const vy = Math.sin(angle) * baseSpeed + Math.cos(angle) * 1.0;

    waterDroplets.push(new WaterDrop(worldTipX, worldTipY, vx, vy));
    totalDropletsReleased++;
  }

  if (!isDissolving) {
    isDissolving = true;
  }
}

tab2WaterCanvas.addEventListener('mousedown', (e) => {
  const rect = tab2WaterCanvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;

  const centerX = washBottle.x;
  const centerY = washBottle.y + washBottle.height / 2;
  const angle = washBottle.angle;

  const dx = mouseX - centerX;
  const dy = mouseY - centerY;

  const localMouseX = dx * Math.cos(-angle) - dy * Math.sin(-angle);
  const localMouseY = dx * Math.sin(-angle) + dy * Math.cos(-angle);

  const halfW = washBottle.width / 2;
  const halfH = washBottle.height / 2;

  if (
    localMouseX >= -halfW &&
    localMouseX <= halfW &&
    localMouseY >= -halfH &&
    localMouseY <= halfH
  ) {
    isSqueezing = true;
    washBottle.isSqueezed = true;
  }
});

window.addEventListener('mouseup', () => {
  isSqueezing = false;
  washBottle.isSqueezed = false;
});

// Get Y coordinate of current liquid surface inside Tab 2 beaker
function getBeakerSurfaceY() {
  const baseLineY = 470; // Y-coordinate of the beaker floor on the canvas
  return baseLineY - solVolume_1 * px_scalor_1;
}

function animateTab2() {
  tab2WaterCtx.clearRect(0, 0, t2Width, t2Height);

  if (isSqueezing) {
    sprayWater();
  }

  // --- DROPLET IMPACT & MOVEMENT ---
  const surfaceY = getBeakerSurfaceY();

  for (let i = waterDroplets.length - 1; i >= 0; i--) {
    const d = waterDroplets[i];
    d.update();
    d.draw();

    // Check if droplet hits the liquid/beaker surface or falls off screen
    if (d.y >= surfaceY) {
      // Drop hit the liquid! Add its mass and volume to targets
      targetWaterMass += 0.05 / 3;
      targetSolVolume_1 += 0.05 / 3;
      waterDroplets.splice(i, 1);
    } else if (d.y > t2Height || d.life <= 0) {
      waterDroplets.splice(i, 1);
    }
  }

  // 1. Solution Level rises quickly (50% catchup per frame)
  if (solVolume_1 < targetSolVolume_1) {
    solVolume_1 += targetSolVolume_1 - solVolume_1;
    if (targetSolVolume_1 - solVolume_1 < 0.0001)
      solVolume_1 = targetSolVolume_1;
    increaseLiquidLevel_1();
  }

  // 2. Balance Mass reacts more slowly (10% catchup per frame)
  if (waterMass < targetWaterMass) {
    waterMass += (targetWaterMass - waterMass) * 0.8;
    if (targetWaterMass - waterMass < 0.0001) waterMass = targetWaterMass;
  }

  // --- SALT DISSOLVE FADE ---
  if (isDissolving && saltOpacity > 0) {
    saltOpacity -= dissolveSpeed;
    if (saltOpacity < 0) saltOpacity = 0;
    tab2SaltCanvas.style.opacity = saltOpacity.toString();
  }

  drawWashBottle();
  if (saltOpacity < 0.25 && waterMass > 10) {
    tab3button.disabled = false;
  }
  requestAnimationFrame(animateTab2);
}

animateTab2();
