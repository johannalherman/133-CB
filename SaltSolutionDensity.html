<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHEM 133 CB - Salt Solution Density Simulation</title>
    <style>
body {
  width: 800px;
  margin: auto;
  font:
    18px Arial,
    sans-serif;
  text-align: center;
  padding: 20px;
}

hr {
  border: 2px solid #8000cf;
  border-radius: 5px;
}

.control-button {
  font-size: 18px;
  padding: 10px 20px;
  background-image: linear-gradient(#d89fff, #f3e3ff 50%, #d89fff);
  border: 2px solid #8000cf;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s;
}
.control-button:hover {
  border: 2px solid white;
}

.row {
  display: flex;
}
.column {
  flex: 50%;
  padding: 0px 20px;
}
.column-dropdowns {
  margin: auto;
}



#glassware-container-1 {
  margin: 20px;
  position: relative;
  display: inline-block;
}

.button-container-1 {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 6%;
  width: 160px;
  font-size: 14px;
  font-style: italic;
  line-height: 0;
  z-index: 10;
}
.button-container-1 button {
  border: 2px solid #8000cf;
  border-radius: 5px;
  margin: 2px;
  padding: 8px 16px;
  cursor: pointer;
}
.button-container-1 button:hover {
  border: 2px solid black;
}

#balance-1 {
  width: 100%;
  z-index: 5;
}
canvas {
  /* display: block;*/
  margin: auto;
  position: relative;
  width: 0px;
  height: 0px;
  z-index: -10;
}
.button-float-1 button {
  position: absolute;
  top: 83%;
  left: 19.25%;
  width: 24px;
  height: 16px;
  border: none;
  background: none;
  cursor: pointer;
}
#total-mass-1 {
  position: absolute;
  top: 78%;
  left: 61%;
  transform: translateX(-50%);
  border-radius: 5px;
  font-size: 22px;
  font-weight: bold;
  z-index: 0;
}



#glassware-container-2 {
  margin: 20px;
  position: relative;
  display: inline-block;
}

.button-container-2 {
  position: absolute;
  left: 0%;
  top: 6%;
  width: 130px;
  font-size: 14px;
  font-style: italic;
  line-height: 0;
  z-index: 10;
}
.button-container-2 button {
  border: 2px solid #8000cf;
  border-radius: 5px;
  margin: 2px;
  padding: 8px 16px;
  cursor: pointer;
}
.button-container-2 button:hover {
  border: 2px solid black;
}

#cylinder {
  width: 100%;
  z-index: 5;
}
#solution-2 {
  position: absolute;
  bottom: 24%;
  left: 50%;
  transform: translateX(-50%);
  width: 13%;
  height: 0px;
  background: #abdcf2;
  transition: height 0.3s ease-in-out;
  opacity: 0.75;
  z-index: -10;
}
#solution-2::after {
  content: '';
  position: absolute;
  top: 0px;
  right: 50%;
  transform: translateX(50%);
  width: 100%;
  height: 5px;
  background: #def1fa; /* Subtle meniscus highlight */
  border-radius: 0% 0% 50% 50%; /* Round only the bottom corners */
  z-index: 0;
}

.button-float-2 button {
  position: absolute;
  bottom: 8.9%;
  left: 19.25%;
  width: 24px;
  height: 16px;
  border: none;
  background: none;
  cursor: pointer;
}
#total-mass-2 {
  position: absolute;
  bottom: 1.4%;
  left: 61%;
  transform: translateX(-50%);
  border-radius: 5px;
  font-size: 22px;
  font-weight: bold;
  z-index: 0;
}





      
    </style>
  </head>
  <body>
<div style="text-align: right; padding: 10px 20px;">
<button id="resetButton" class="control-button" type="button" onclick="reset()">
  Reset All Controls
</button>
</div>
<hr />

<div class="row">
  <div class="column">
    <!--Balance Area #1 Code-->
    <div id="glassware-container-1">
      <div class="button-container-1">
        <p>Salt Controls</p>
        <button id="addSmallacidBtn" type="button">Add Small Amount</button>
        <button id="addLargeacidBtn" type="button">Add Large Amount</button>
      </div>
      <img
        id="balance-1"
        src="https://github.com/johannalherman/133-CB/blob/main/Beaker%20+%20Balnce%20with%20tare.png?raw=true"
      />
      <p id="total-mass-1"><span>0.000</span> g</p>
      <div class="button-float-1">
        <button
          id="tareButton-1"
          type="button"
          aria-label="Tare Scale"
        ></button>
      </div>
      <canvas id="canvas"></canvas>
    </div>
  </div>

  <div class="column">
    <!--Balance Area #2 Code-->
    <div id="glassware-container-2">
      <div class="button-container-2">
        <p>Solution Controls</p>
        <button id="dropsButton" type="button" disabled>Add Drops</button>
        <button id="pourButton" type="button" disabled>Pour In</button>
        <button id="removeSolution" type="button" disabled>Pour Out</button>
      </div>

      <div id="solution-2"></div>
      <img
        id="cylinder"
        src="https://github.com/johannalherman/133-CB/blob/main/Grad%20Cyld%20+%20Balnce%20with%20tare.png?raw=true"
        alt="Graduated cylinder on balance"
      />
      <p id="total-mass-2"><span>0.000</span> g</p>
      <div class="button-float-2">
        <button id="tareButton" type="button" aria-label="Tare Scale"></button>
      </div>
    </div>
  </div>
</div>

<hr />
<div
  style="
    font:
      16px Arial,
      sans-serif;
    color: #8000cf;
    text-align: left;
  "
>
  <p>
    <em
      >This simulation was designed for use on a laptop or desktop computer.
      Functions may not operate on a mobile device.</em
    >
  </p>
  <p>
    <em
      >Created by Johanna L. Herman, Ph.D. for use in CHEM 133 at the University
      of Delaware.</em
    >
  </p>
</div>




    
    
  <script>
function getRandomAmount(min, max) {
  return Math.random() * (max - min) + min;
}

let densitySolution = 1;
let cylinderMass = getRandomAmount(25, 30);
let totalMass_2 = cylinderMass;
let massSolution_2 = 0;
let tareOffset_2 = 0;
let solVolume_2 = 0;
let cylinderVolume = 380; // Total px height volume of the cylinder
let px_scalor_2 = 29.047902121796465; // number of px in mL in cylinder image


const dropsButtonBtn = document.getElementById('dropsButton');
const pourButtonBtn = document.getElementById('pourButton');
const removeBtn = document.getElementById('removeSolution');

function enableButtons() {
  dropsButtonBtn.disabled = false;
  pourButtonBtn.disabled = false;
  removeBtn.disabled = false;
}

function disableButtons() {
  dropsButtonBtn.disabled = true;
  pourButtonBtn.disabled = true;
  removeBtn.disabled = true;
}

function reset() {
  disableButtons();
  solVolume_2 = 0;
  cylinderMass = getRandomAmount(25, 30);
  totalMass_2 = cylinderMass;
  tareOffset_2 = 0;
  updateMassDisplay_2();
  document.getElementById('solution-2').style.height = '0px';
}


dropsButtonBtn.addEventListener('click', () => {
  addSolution_2('drops');
});

pourButtonBtn.addEventListener('click', () => {
  addSolution_2('pour');
});

removeBtn.addEventListener('click', () => {
  removeSolution_2();
});

document.getElementById('tareButton').addEventListener('click', () => {
  tareOffset_2 = totalMass_2;
  updateMassDisplay_2();
});

function addSolution_2(size) {
  let amount = size === 'drops' ? 0.05 : getRandomAmount(2, 3);
  
  solVolume_2 = Math.min(cylinderVolume / px_scalor_2, solVolume_2 + amount);
  massSolution_2 = solVolume_2 * densitySolution;
  totalMass_2 = massSolution_2 + cylinderMass;
  updateMassDisplay_2();
  increaseLiquidLevel_2();
}

function removeSolution_2() {
  let amount = getRandomAmount(1.5, 2.5);
  if (amount >= solVolume_2) {
    amount = solVolume_2;
  }
  solVolume_2 = Math.max(0, solVolume_2 - amount);
  massSolution_2 = solVolume_2 * densitySolution;
  totalMass_2 = massSolution_2 + cylinderMass;
  updateMassDisplay_2();
  increaseLiquidLevel_2();
}

function increaseLiquidLevel_2() {
  if (solVolume_2 > 0) {
    document.getElementById('solution-2').style.height =
      solVolume_2 * px_scalor_2 + 4 + 'px';
  } else {
    document.getElementById('solution-2').style.height =
      solVolume_2 * px_scalor_2 + 'px';
  }
}

function updateMassDisplay_2() {
  document.querySelector('#total-mass-2 span').textContent = (
    totalMass_2 - tareOffset_2
  ).toFixed(3);
}

updateMassDisplay_2();



    
  </script>
  </body>
</html>
